[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "session-watch"
version = "0.1.0"
description = "Monitor authenticated web pages with human login and local LLM change classification"
requires-python = ">=3.11"
dependencies = ["playwright>=1.51,<2", "beautifulsoup4>=4.12,<5", "httpx>=0.28,<1", "filelock>=3.16,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
session-watch = "session_watch.cli:main"

[tool.setuptools.packages.find]
include = ["session_watch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
